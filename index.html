<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.SPORTS INTERNATIONAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05070a;color:#fff;font-family:Arial}
.top{padding:14px;background:#070c14;position:sticky;top:0;z-index:20;border-bottom:1px solid #1e2a3d}
.logo{font-size:26px;font-weight:900}.logo b{color:#1677ff}
.live-dot{color:#ff3b3b;font-size:11px;margin-left:8px;animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
select,input{width:100%;padding:12px;margin-top:10px;background:#111823;color:#fff;border:1px solid #2a3a52;border-radius:10px;font-size:15px}
.tabs{display:flex;gap:6px;margin-top:12px}
.tabs button{flex:1;padding:9px;background:#111823;border:1px solid #1e2a3d;color:#8392a8;border-radius:20px;font-weight:700}
.tabs button.active{background:#1677ff;color:#fff}
#box{padding:12px}
.card{background:linear-gradient(180deg,#17233a,#0c101a);border:1px solid #1e2a3d;border-radius:16px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.team-row{display:flex;justify-content:space-between;padding:4px 0;font-weight:700}
.small{font-size:10px;color:#8392a8;margin-top:5px}.live{color:#ff3b3b;font-weight:900}
.score{background:#000;padding:8px 12px;border-radius:10px;font-weight:900;font-size:18px}
.country{font-size:11px;color:#1677ff;margin-bottom:4px}
</style>
</head>
<body>
<div style="max-width:650px;margin:auto">
<div class="top">
<div class="logo"><b>S.</b>SPORTS <span class="live-dot">● LIVE</span></div>
<select id="league">
<optgroup label="🌍 INTERNATIONAL">
<option value="fifa.worldq">World Cup Qualification</option>
<option value="uefa.nations">UEFA Nations League</option>
<option value="caf.nations">AFCON - Africa</option>
<option value="uefa.champions">Champions League</option>
<option value="uefa.europa">Europa League</option>
</optgroup>
<optgroup label="🏴󠁧󠁢󠁥󠁮󠁧󠁿 ENGLAND">
<option value="eng.1" selected>Premier League</option>
<option value="eng.fa">FA Cup</option>
</optgroup>
<optgroup label="🇪🇸 SPAIN"><option value="esp.1">La Liga</option></optgroup>
<optgroup label="🇩🇪 GERMANY"><option value="ger.1">Bundesliga</option></optgroup>
<optgroup label="🇬🇭 AFRICA"><option value="rsa.1">South Africa PSL</option><option value="egy.1">Egypt Premier</option></optgroup>
<optgroup label="🇺🇸 AMERICAS"><option value="usa.1">MLS</option><option value="bra.1">Brazil</option></optgroup>
</select>
<input id="search" placeholder="Search Ghana, Arsenal, Nigeria...">
<div class="tabs">
<button class="active" data-f="all">All</button>
<button data-f="live">🔴 Live</button>
<button data-f="finished">Finished</button>
</div>
</div>
<div id="box">Loading...</div>
</div>
<script>
let EVENTS=[],FILTER='all';
const box=document.getElementById('box'),league=document.getElementById('league'),search=document.getElementById('search');
async function load(){
box.innerHTML='<p style="text-align:center;color:#8392a8;padding:30px">Loading '+league.options[league.selectedIndex].text+'...</p>';
try{
const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/'+league.value+'/scoreboard');
const j=await r.json();EVENTS=j.events||[];
}catch(e){box.innerHTML='<p style="text-align:center;color:#ff3b3b;padding:30px">Check internet</p>';return}
show();
}
function show(){
let list=[...EVENTS];
if(FILTER==='live')list=list.filter(e=>e.competitions[0].status.type.state==='in');
if(FILTER==='finished')list=list.filter(e=>e.competitions[0].status.type.state==='post');
const q=search.value.toLowerCase();
if(q)list=list.filter(e=>e.name.toLowerCase().includes(q));
if(!list.length){box.innerHTML='<p style="text-align:center;color:#666;padding:30px">No games today<br>Try another league</p>';return;}
box.innerHTML=list.map(ev=>{
const c=ev.competitions[0];const h=c.competitors.find(x=>x.homeAway==='home');const a=c.competitors.find(x=>x.homeAway==='away');const live=c.status.type.state==='in';
return `<div class="card"><div style="flex:1"><div class="country">${c.status.type.detail.toUpperCase()}</div><div class="team-row"><span>${h.team.displayName}</span><span>${h.score||0}</span></div><div class="team-row"><span>${a.team.displayName}</span><span>${a.score||0}</span></div><div class="small ${live?'live':''}">${live?'● LIVE • ':''}${c.status.type.detail}</div></div><div class="score">${h.score||0}-${a.score||0}</div></div>`;
}).join('');
}
document.querySelectorAll('.tabs button').forEach(b=>{
b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');FILTER=b.dataset.f;show();}
});
league.onchange=load;search.oninput=show;
load();setInterval(load,30000);
</script>
</body>
    </html>
